<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navegador de Astros - NASA APOD</title>
    <link rel="stylesheet" href="style.css">
   
</head>
<body>
    <div class="container">
        <header>
            <h1>🌌 Navegador de Astros</h1>
            <p>Busque imagens históricas do Astronomy Picture of the Day (NASA)</p>
        </header>

        <aside class="config-panel">
            <h3>⚙️ Configurações</h3>
            <div class="input-group">
                <label for="apiKey">NASA API Key:</label>
                <input type="password" id="apiKey" value="DEMO_KEY">
            </div>
            <div class="input-group">
                <label for="quantidade">Amostragem (10-100):</label>
                <input type="number" id="quantidade" min="10" max="100" value="30">
            </div>
            <div class="input-group checkbox" style="display: none;">
                <!-- Ocultado para simplificar a explicação do script -->
                <input type="checkbox" id="traduzir">
            </div>
        </aside>

        <main class="search-panel">
            <div class="search-box">
                <input type="text" id="astroInput" placeholder="Qual astro deseja buscar? (Ex: Mars, Saturn, Nebula)">
                <button id="btnBuscar">Buscar Imagens 🚀</button>
            </div>

            <div id="status" class="status"></div>

            <!-- CONTÊINER DO CARROSSEL (Manipulado dinamicamente pelo JS) -->
            <div id="carrosselVisual" class="carrossel-container">
                <h2 id="tituloImagem">Título da Imagem</h2>
                <img id="imagemExibida" src="" alt="Imagem da NASA">
                
                <div class="botoes-carrossel">
                    <button id="btnAnterior" class="btn-nav">◀ Anterior</button>
                    <button id="btnProximo" class="btn-nav">Próximo ▶</button>
                </div>
                
                <p><a id="linkOriginal" href="#" target="_blank" class="link-imagem">🔗 Abrir link direto da imagem</a></p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
